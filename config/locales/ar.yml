  b2b:
    title: "حلول الأعمال والمشاريع — ألومنيوم مزايا"
    description: "نقدم منتجات وحلول ألومنيوم للمقاولين والشركات والمشاريع، مع إمكانية التصنيع حسب الطلب وتطوير الحلول وفق المواصفات الفنية ومتطلبات الاستخدام."
    hero:
      label: "للأعمال والمشاريع"
      h1: "من متطلبات مشروعك… إلى حل جاهز للتنفيذ."
      desc: "نقدم منتجات وحلول ألومنيوم للمقاولين والشركات والمشاريع، مع إمكانية التصنيع حسب الطلب وتطوير الحلول وفق المواصفات الفنية ومتطلبات الاستخدام."
      secondary: "حمّل الكتالوج الفني"
    solutions:
      label: "حلول للأعمال"
      h2: "احتياجات مختلفة. وقدرات تصنيع تستوعبها."
      desc: "سواء كنت تبحث عن منتج بمواصفات محددة أو حل يتم تطويره خصيصًا لمشروعك، توفر مزايا خيارات متعددة تجمع بين المنتجات الجاهزة وقدرات التصنيع حسب الطلب."
    custom:
      label: "التصنيع حسب الطلب"
      h2: "عندما يحتاج مشروعك أكثر من منتج جاهز."
      desc: "نطوّر حلولًا مخصصة وفق متطلبات المشروع، بداية من التصميم والمقاسات، وحتى السماكات والأحمال والتشطيبات المطلوبة."
      desc2: "يمكنك تزويد فريقنا بالرسم الهندسي، أو العمل معنا على تطوير التصميم المناسب للتطبيق."
      points:
        - ["التصميم", "وفق الرسم المقدم أو من خلال فريق مزايا."]
        - ["المقاسات والسماكات", "تُحدد بحسب متطلبات الحل."]
        - ["الأحمال والتحمّل", "تُراعى ضمن متطلبات التصميم والاستخدام."]
        - ["التشطيبات والألوان", "خيارات قابلة للتخصيص بحسب المشروع."]
      cta: "استكشف الحلول المخصصة"
    projects:
      label: "خبرة على أرض الواقع"
      h2: "مشاريع كبرى اختارت مزايا."
      desc: "خبرتنا في التصنيع تمتد إلى المشاركة في عدد من المشاريع البارزة في المملكة."
      cta: "استكشف جميع المشاريع"
    catalog:
      label: "الكتالوج الإلكتروني"
      h2: "المنتجات والمواصفات التي تحتاجها في مكان واحد."
      desc: "استعرض مجموعة منتجات وحلول مزايا، وتعرّف على الخيارات والمواصفات المتاحة لمساعدتك في تحديد الأنسب لاحتياجات عملك أو مشروعك."
      primary: "استعرض الكتالوج"
    rfq:
      label: "لديك متطلبات مشروع؟"
      h2: "أرسل التفاصيل، ونبدأ منها."
      desc: "شاركنا نوع المشروع والكميات والمواصفات المطلوبة، ويمكنك إرفاق الرسومات أو كراسة الشروط ليتم توجيه طلبك إلى الفريق المختص."
    partnership:
      label: "شركاء مزايا"
      h2: "شراكات تمتد أبعد من التوريد."
      desc: "نعمل مع شبكة واسعة من الموزعين، ونبني علاقات تجارية طويلة المدى تدعم وصول منتجات مزايا إلى العملاء والأسواق المختلفة."
      cta: "تعرّف على الشراكة مع مزايا"
    final:
      h2: "جاهزون لمتطلبات مشروعك."
      desc: "من المنتجات الجاهزة إلى الحلول المخصصة، تواصل مع فريق مزايا وشاركنا احتياجك للبدء."

