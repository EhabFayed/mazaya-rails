  about:
    title: "من نحن — ألومنيوم مزايا"
    description: "شركة مصنع مزايا للألومنيوم، شركة سعودية متخصصة في تصنيع وتوريد منتجات وحلول الألومنيوم للاستخدامات الإنشائية والتجارية والصناعية، بخبرة بدأت منذ عام 1991."
    hero:
      label: "من نحن"
      h1: "منذ 1991… نصنع حلولًا تتطور مع احتياجات السوق."
      desc: "شركة مصنع مزايا للألومنيوم، شركة سعودية متخصصة في تصنيع وتوريد منتجات وحلول الألومنيوم للاستخدامات الإنشائية والتجارية والصناعية، بخبرة بدأت منذ عام 1991 وتطورت لتواكب احتياجات السوق والمشاريع المختلفة."
    story:
      label: "قصتنا"
      h2: "أكثر من ثلاثة عقود من الخبرة والتطور."
      p1: "بدأت رحلة مزايا عام 1991 في تصنيع منتجات الألومنيوم، ومع تطور احتياجات السوق توسع نطاق عملنا ليشمل مجموعة أكبر من المنتجات والحلول التي تخدم المشاريع والقطاعات المختلفة."
      p2: "واليوم، تجمع مزايا بين المنتجات القياسية الجاهزة والحلول المخصصة، بما يتيح لنا التعامل مع متطلبات متنوعة من حيث التصميم والمقاسات والمواصفات وطبيعة الاستخدام."
    values:
      label: "قيمنا"
      h2: "مبادئ تقود طريقة عملنا."
      items:
        - ["الأصالة الوطنية", "نعتز بجذورنا السعودية وما بنيناه من خبرة محلية على مدار السنوات."]
        - ["السلامة أولًا", "نضع السلامة في مقدمة أولوياتنا عند تطوير منتجاتنا وحلولنا."]
        - ["الاعتمادية والتوفر", "نعمل على تقديم منتجات وحلول يمكن للعملاء الاعتماد عليها والوصول إليها."]
        - ["الخبرة والإرث", "نبني على خبرة بدأت منذ 1991 ونواصل تطويرها بما يواكب احتياجات السوق."]
        - ["الابتكار والتخصيص", "نطوّر حلولًا تتناسب مع الاستخدامات المختلفة، بمرونة في التعامل مع المتطلبات الخاصة."]
        - ["الشراكة والدعم", "نبني علاقات طويلة المدى مع عملائنا وشركائنا تتجاوز حدود توريد المنتج."]
    numbers:
