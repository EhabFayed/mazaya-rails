# Production stack for one host: Rails (Thruster + Puma, Solid Queue inside
# Puma) + PostgreSQL. Only the web port is published, on localhost, so the
# host's nginx terminates TLS and proxies to it.
#
#   cp .env.example .env   # fill the values
#   docker compose -f compose.production.yml up -d --build
#
services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: mazaya
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: mazaya_production
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mazaya -d mazaya_production"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    build: .
    image: new-mazaya-web:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      RAILS_ENV: production
      RAILS_LOG_TO_STDOUT: "1"
      RAILS_SERVE_STATIC_FILES: "1"
      SOLID_QUEUE_IN_PUMA: "true"
      DATABASE_URL: postgres://mazaya:${POSTGRES_PASSWORD}@db:5432/mazaya_production
      SECRET_KEY_BASE: ${SECRET_KEY_BASE:?set SECRET_KEY_BASE in .env}
      APP_HOST: ${APP_HOST:?set APP_HOST in .env}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@mazaya.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-change-me}
      LEADS_NOTIFY_TO: ${LEADS_NOTIFY_TO:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@mazaya.example.com}
      SMTP_ADDRESS: ${SMTP_ADDRESS:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_DOMAIN: ${SMTP_DOMAIN:-}
      ACTIVE_STORAGE_SERVICE: local
    volumes:
      - storage:/rails/storage
    ports:
      - "127.0.0.1:${WEB_PORT:-9030}:80"

volumes:
  db_data:
  storage:
