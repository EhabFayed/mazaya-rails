services:
  db:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mazaya_development
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  redis:
    image: redis:7
    restart: always
    ports:
      - "6379:6379"

  app:
    build: .
    restart: always
    depends_on:
      - db
      - redis
    # host files are uid 1001; the image's default user is 1000
    user: "1001:1001"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/mazaya_development
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
    volumes:
      - .:/rails
      - storage:/rails/storage
    ports:
      - "3000:3000"
    entrypoint: []
    command: ["bash", "-c", "bin/rails db:prepare && exec bin/rails server -b 0.0.0.0"]

  sidekiq:
    build: .
    restart: always
    depends_on:
      - redis
      - db
    user: "1001:1001"
    environment:
      DATABASE_URL: postgres://postgres:password@db:5432/mazaya_development
      REDIS_URL: redis://redis:6379/0
      RAILS_ENV: development
    volumes:
      - .:/rails
      - storage:/rails/storage
    entrypoint: []
    command: ["bundle", "exec", "sidekiq", "-r", "./config/environment.rb"]

volumes:
  postgres_data:
  storage:
