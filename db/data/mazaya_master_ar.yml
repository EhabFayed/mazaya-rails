# Arabic for the English-only content of "Mazaya Catalogue Master.xlsx".
# Applied by MazayaArabic (lib/mazaya_arabic.rb) from the master importer and
# from `bin/rails products:translate_ar`. Keys under `phrases` are matched
# case-insensitively after collapsing whitespace and trailing punctuation.
# Numbers with units (150 kg, 3.70 m, 300 × 300 mm …) are converted by rules in
# the module and need no entry here.

overviews:
  platform-ladder-with-stabilizer: >-
    سُلّم منصة من الألمنيوم مزوّد بمُثبّت، مصمم لتوفير وصول آمن وثابت وموثوق لأعمال الصيانة المرتفعة.
  platform-ladder: >-
    سُلّم منصة من الألمنيوم خفيف الوزن، مصمم للوصول الآمن والمريح إلى مناطق العمل المرتفعة.
  double-platform-ladder: >-
    سُلّم منصة مزدوج الجانب من الألمنيوم، مصمم لوصول آمن وثابت وعمل فعّال على الارتفاعات.
  adjustable-ladder: >-
    سُلّم ألمنيوم قابل للتعديل، مصمم لتوفير وصول مرن وموثوق على ارتفاعات عمل متفاوتة.
  step-ladder: >-
    سُلّم درجات من الألمنيوم، مصمم لوصول آمن ومريح وأداء موثوق في أعمال الصيانة والاستخدام اليومي.
  mobile-platform-ladder: >-
    سُلّم منصة متحرك من الألمنيوم، مصمم لوصول آمن وثابت وأعمال صيانة فعّالة على الارتفاعات.
    يتميز بتصميم متحرك، ومنصة عمل، وقاعدة ثابتة، وهيكل من الألمنيوم.
  fixed-ladder-with-safety-cage: >-
    سُلّم ألمنيوم ثابت مزوّد بقفص حماية، مصمم للوصول الرأسي الآمن إلى المناطق المرتفعة.
    يتميز بقفص أمان، وتثبيت دائم، ومقاومة للتآكل، ومقاسات مخصصة.
  mobile-access-platform-with-stairs: >-
    منصة وصول متحركة من الألمنيوم مع درج مدمج ودرابزين أمان، مصممة لعمل مرتفع آمن ومريح.
    تتميز بتصميم متحرك، ودرج مدمج، ودرابزين أمان، وعجلات قابلة للقفل.
  mobile-maintenance-platform-with-stairs: >-
    منصة وصول متحركة بسطح عمل واسع مضاد للانزلاق ودرابزين أمان وقاعدة ثابتة بعجلات، مصممة لصيانة آمنة وفعّالة
    في المنشآت الصناعية والمستودعات ومناطق صيانة الطائرات والمركبات. تتوفر بمقاسات مخصصة، بما في ذلك حلول للوصول في حالات الطوارئ.
  double-sided-mobile-access-platform: >-
    منصة وصول متحركة مزدوجة الجانب بدرج مركزي ومستويات عمل متعددة ودرابزين أمان وقاعدة بعجلات، مصممة لوصول آمن لأعمال الصيانة.
  industrial-platform-ladder: >-
    سُلّم منصة صناعي ذاتي الارتكاز بدرجات مائلة ومنصة عمل علوية ودرابزين أمان، مصمم للوصول الآمن إلى مناطق العمل المرتفعة.
  elevated-access-platform-with-stairs: >-
    منصة وصول مرتفعة متينة، مصممة لتوفير وصول آمن وفعّال إلى المناطق المرتفعة لأعمال الصيانة والتشغيل. تتميز بسطح مضاد للانزلاق
    ودرج مدمج ودرابزين أمان كامل مع مقابض، لتجمع بين الثبات والسلامة والعملية في حل واحد. مقاساتها القابلة للتخصيص تلبي متطلبات مشروعك.
  step-platform-ladder: >-
    سُلّم منصة متين ذاتي الارتكاز، مصمم للوصول الآمن والفعّال إلى مناطق العمل المرتفعة. يتميز بدرجات مضادة للانزلاق ومنصة عمل مرتفعة
    ومقابض أمان على الجانبين وهيكل ثابت خفيف الوزن، ليضمن أداءً موثوقًا وسلامة أعلى للمستخدم. تتوفر مقاسات مخصصة حسب متطلبات المشروع.
  industrial-wide-step-ladder: >-
    سُلّم صناعي مائل متين، مصمم لتوفير وصول آمن ومريح بين المستويات المرتفعة. يتميز بدرجات واسعة مضادة للانزلاق ومقابض أمان ممتدة
    وهيكل مائل ثابت، ليضمن سلامة أعلى للمستخدم وأداءً موثوقًا في البيئات الصناعية والتجارية. تتوفر مقاسات مخصصة حسب متطلبات المشروع.
  industrial-access-ladder: >-
    سُلّم صناعي مائل متين، مصمم لتوفير وصول آمن وفعّال في مناطق الصيانة والمنشآت الصناعية والمستودعات ومناطق الإنتاج والورش.
    يتميز بدرجات مضادة للانزلاق ومقابض أمان على الجانبين وهيكل ثابت، ليضمن أداءً موثوقًا وسلامة أعلى للمستخدم. تتوفر مقاسات مخصصة حسب متطلبات الاستخدام.
  rolling-shelf-ladder: >-
    سُلّم رفوف متحرك متين، مصمم لتوفير وصول آمن ومريح إلى الرفوف العالية ومناطق التخزين. يتميز بدرجات واسعة مضادة للانزلاق ومقابض أمان
    وعجلات لسهولة الحركة، ليجمع بين الثبات والسلامة والعملية في المستودعات ومرافق التخزين والبيئات الصناعية. تتوفر مقاسات مخصصة حسب متطلبات المشروع.
  aluminum-straight-ladder: >-
    سُلّم ألمنيوم مستقيم خفيف الوزن ومتين، مصمم لتوفير وصول آمن ومريح إلى المناطق المرتفعة. يتميز بهيكل مقاوم للتآكل وتصميم بسيط غير قابل للتعديل،
    ليوفر سهولة في التعامل وأداءً موثوقًا ومتانة طويلة الأمد للاستخدامات الصناعية والتجارية وأعمال الصيانة.
  double-part-extension-aluminium-ladder: >-
    سُلّم ألمنيوم تمديد ثنائي الأجزاء خفيف الوزن ومتين، مصمم لتوفير وصول آمن وموثوق إلى المناطق المرتفعة. يتميز بهيكل مقاوم للتآكل
    وتصميم عملي بسيط، ليضمن سهولة في التعامل وأداءً طويل الأمد واستخدامًا عمليًا في المجالات الصناعية والتجارية وأعمال الصيانة.
  triple-part-extension-aluminium-ladder: >-
    سُلّم ألمنيوم تمديد ثلاثي الأجزاء خفيف الوزن ومتين، مصمم لتوفير وصول آمن وموثوق إلى المناطق المرتفعة. يتميز بهيكل مقاوم للتآكل
    وتصميم مستقيم عملي، ليوفر سهولة في التعامل ومتانة طويلة الأمد وأداءً يمكن الاعتماد عليه في الاستخدامات الصناعية والتجارية وأعمال الصيانة.
  aluminum-multi-purpose-ladder: >-
    سُلّم ألمنيوم متعدد الاستخدامات خفيف الوزن ومتين، مصمم لتوفير وصول آمن وموثوق إلى المناطق المرتفعة. يتميز بهيكل مقاوم للتآكل
    وتصميم عملي، ليوفر سهولة في التعامل ومتانة طويلة الأمد وأداءً يمكن الاعتماد عليه في الاستخدامات الصناعية والتجارية وأعمال الصيانة.
  aluminum-platform-step-ladder: >-
    سُلّم ألمنيوم بمنصة ودرجات خفيف الوزن ومتين، مصمم لتوفير وصول آمن وموثوق إلى المناطق المرتفعة. يتميز بهيكل مقاوم للتآكل
    وتصميم عملي ثابت، ليوفر سهولة في التعامل ومتانة طويلة الأمد وأداءً يمكن الاعتماد عليه في الاستخدامات الصناعية والتجارية وأعمال الصيانة.
  professional-aluminum-extension-ladder: >-
    سُلّم ألمنيوم تمديد احترافي، مصمم لتوفير وصول آمن وموثوق إلى المناطق المرتفعة. يتميز ببنية خفيفة الوزن ومقاومة للتآكل ومتينة،
    ليوفر سهولة في التعامل ودعمًا ثابتًا وأداءً يمكن الاعتماد عليه في أعمال الصيانة والإنشاءات والاستخدامات الصناعية.
  wheeled-ladder: >-
    سُلّم ألمنيوم بعجلات، مصمم للاستخدام العملي في الصيدليات والمتاجر، بحركة سلسة ومساحة لوضع المنتجات وعجلات ومنصة وقوف مريحة.
  construction-ladder: >-
    سُلّم مشاريع من الألمنيوم عالي الجودة، مصمم لأعمال المشاريع والإنشاءات، يتميز بإمكانية الفتح بزاوية 180 درجة وسعة تحميل عالية
    وميزات أمان وأقدام مطاطية مانعة للانزلاق.
  work-ladder: >-
    سُلّم عمل من الألمنيوم، مصمم للأعمال المنزلية وأعمال الصيانة والورش. يمكن تصنيعه وفق متطلبات العميل.
  rooftop-ladder: >-
    سُلّم أسطح من الألمنيوم عالي الجودة، مصمم للوصول إلى الأسطح والخزانات، بدرجة واسعة ومريحة وحماية جانبية وميزات أمان.
  manhole-cover-6-5-cm: >-
    غطاء منهل غائر من الألمنيوم متين، مصمم لتوفير وصول آمن ومريح إلى غرف التفتيش. يتميز بحشوة مطاطية EPDM وعمق 6.5 سم، ليضمن
    إحكامًا تامًا وأداءً موثوقًا. يتوفر بمقاسات متعددة من 30 × 30 سم حتى 100 × 100 سم، مع إمكانية التصنيع بمقاسات مخصصة حسب متطلبات المشروع.
  manhole-cover-clean-out: >-
    غطاء فتحة تنظيف من الألمنيوم عالي الجودة، مصمم لتوفير وصول مريح إلى نقاط التصريف والتنظيف مع عزل فعّال للروائح.
    يتميز ببنية ألمنيوم متينة توفر أداءً موثوقًا وحلًا عمليًا للوصول إلى شبكات التصريف. يتوفر بمقاس 200 × 200 مم.
  water-tank-with-chamber: >-
    غطاء خزان مياه من الألمنيوم متين، مصمم لتوفير وصول آمن ومريح لأعمال الفحص والصيانة. يتميز بغرفة وصول واحدة وبنية ألمنيوم عالية المتانة
    وحشوة مطاطية EPDM ومقابض رفع مدمجة، ليضمن أداءً موثوقًا وسهولة في التعامل. بعمق 5 سم، ويتوفر بمقاسات من 600 × 600 مم حتى 1000 × 1000 مم،
    مع إمكانية التصنيع بمقاسات مخصصة حسب الطلب.
  water-tank-normal: >-
    غطاء خزان مياه من الألمنيوم عالي الجودة، مصمم لتوفير وصول آمن وموثوق لأعمال الفحص والصيانة. يتميز بعمق 5 سم وحشوة مطاطية EPDM
    وشبكة داخلية لمزيد من الحماية والسلامة، مع بنية متينة وأداء يمكن الاعتماد عليه. يتوفر بمقاسات متعددة، مع إمكانية التصنيع بمقاسات مخصصة حسب متطلبات المشروع.
  floor-drain-recess: >-
    مصرف أرضي غائر من الألمنيوم متين، مصمم لتصريف مياه الأسطح مع اندماج تام مع أسطح الأرضيات والأسقف النهائية. مناسب للتغطية بالبلاط
    أو السيراميك أو البورسلين ليمنح تشطيبًا أنيقًا وعمليًا. بمقاس 150 × 150 مم وعمق 50 مم، يوفر حلًا موثوقًا لمشاريع البناء الحديثة.
  runoff-water-drainage: >-
    قناة تصريف مياه من الألمنيوم متينة، مصممة لتصريف فعّال للمياه الخارجية وإدارتها. تتميز ببنية مقاومة للعوامل الجوية والتآكل وقدرة تحمّل عالية،
    لتوفر أداءً موثوقًا في البيئات الخارجية القاسية. تتوفر بعرض 100 مم و150 مم، مع مخارج تصريف 2 أو 3 بوصة وأطوال متعددة، مع إمكانية التصنيع بأطوال مخصصة حسب متطلبات المشروع.
  honeycomb-runoff-water-drainage: >-
    قناة تصريف مياه من الألمنيوم متينة بغطاء شبكي بنمط خلية النحل، مصممة لتصريف خارجي فعّال وإدارة موثوقة للمياه. تتميز ببنية مقاومة للعوامل الجوية
    والتآكل وقدرة تحمّل عالية، لتضمن أداءً يمكن الاعتماد عليه في البيئات الخارجية القاسية. تتوفر بعرض 100 مم و150 مم، مع مخارج تصريف 2 أو 3 بوصة
    وأطوال متعددة، مع إمكانية التصنيع بأطوال مخصصة حسب متطلبات المشروع.
  fish-runoff-water-drainage: >-
    قناة تصريف مياه من الألمنيوم متينة بغطاء زخرفي بنمط حراشف السمك، مصممة لتصريف خارجي فعّال ومظهر أجمل للأسطح. مصنوعة من ألمنيوم مقاوم
    للعوامل الجوية والتآكل، وتوفر أداءً موثوقًا وقدرة تحمّل عالية. تتوفر بعرض 100 مم وعمق 150 مم ومخرج تصريف 2 بوصة، مع أطوال متعددة وخيارات مقاسات مخصصة حسب متطلبات المشروع.
  stainless-steel-runoff-water-drainage: >-
    قناة تصريف من الستانلس ستيل عالية الجودة، مصممة لتصريف فعّال للمياه الخارجية وأداء طويل الأمد. تتميز ببنية مقاومة للعوامل الجوية والتآكل،
    لتوفر تصريفًا موثوقًا ومتانة في البيئات القاسية مع قوة تحمّل الأحمال الثقيلة. تتوفر بعرض 100 مم وعمق 150 مم ومخرج تصريف 2 بوصة، مع خيارات تصنيع مخصصة حسب متطلبات المشروع.
  tile-insert-runoff-water-drainage: >-
    قناة تصريف من الألمنيوم عالية الجودة، مصممة لاستيعاب تشطيب البلاط لتمنح مظهرًا مخفيًا ومتجانسًا يندمج تمامًا مع الأسطح المحيطة. تتميز ببنية متينة
    مقاومة للعوامل الجوية والتآكل وقدرة تحمّل عالية، لتضمن تصريفًا فعّالًا وأداءً طويل الأمد. مزوّدة بمخرج تصريف 2 بوصة، مع إمكانية التصنيع بأطوال مخصصة حسب متطلبات المشروع.
  aluminum-wall-access-panel: >-
    فتحة صيانة جدارية متينة، مصممة لتوفير وصول سهل ومريح إلى الخدمات المخفية لأعمال الفحص والصيانة. تتميز بإطار بعمق 4 سم وباب مفصلي
    وبنية معدنية قوية، لتجمع بين العملية والمتانة والتشطيب الأنيق. مناسبة للجدران المبلطة وجدران الجبس بورد، وتتوفر بمقاسات متعددة مع إمكانية التصنيع بمقاسات مخصصة حسب الطلب.
  access-hatch-door: >-
    فتحة سطح من الألمنيوم عالية الجودة، مصممة لتوفير وصول آمن ومريح إلى الأسطح لأعمال الفحص والصيانة. تتميز ببنية ألمنيوم متينة وفتح بمساعدة
    مكابس غازية ومقبض إغلاق محكم وعزل مقاوم للعوامل الجوية، لتضمن تشغيلًا موثوقًا وحماية فعّالة من تسرب المياه. تتوفر بمقاسات متعددة مع إمكانية التصنيع بمقاسات مخصصة حسب متطلبات المشروع.
  aluminum-sliding-roof-access-hatch: >-
    فتحة سطح منزلقة معزولة من الألمنيوم عالية الجودة، مصممة لتوفير وصول آمن ومريح إلى السطح بفتحة صافية واسعة. تتميز بعزل بسماكة 50 مم
    بمعامل انتقال حراري 0.43 واط/م²·ك وإحكام مزدوج ومجارٍ انزلاق تلسكوبية، لتضمن عزلًا حراريًا فعّالًا وأداءً محكمًا ضد العوامل الجوية.
    وتجعلها آلية الدفع والسحب السلسة مثالية للمناطق ذات الارتفاع المحدود والرياح القوية.
  aluminum-access-hatch-door: >-
    فتحة وصول متينة، مصممة لتوفير وصول مريح وموثوق إلى الخدمات المخفية لأعمال الفحص والصيانة. تتميز بباب مفصلي ومفصلات شديدة التحمّل
    ومزاليج إغلاق محكمة، لتضمن سهولة التشغيل وأمانًا أعلى وأداءً طويل الأمد. تتوفر مقاسات مخصصة حسب متطلبات المشروع.
  ceiling-access-panel: >-
    فتحة وصول سقفية من الألمنيوم عالية الجودة، مصممة لتوفير وصول مريح لفحص وصيانة الخدمات المخفية في الأسقف. تتميز ببنية ألمنيوم متينة
    وخيارَي إغلاق، لتضمن سهولة التشغيل وأداءً موثوقًا وتشطيبًا عمليًا. تتوفر بمقاسات متعددة مع خيارات تصنيع مخصصة حسب متطلبات المشروع.
  mobile-roll-cage: >-
    قفص متحرك شديد التحمّل مصنوع من أنابيب أسلاك فولاذية مع قاعدة من صفيح فولاذي بسماكة 3 مم، ومزوّد بأربع عجلات قطر 160 مم لسهولة الحركة.
  collapsible-cage-pallet: >-
    بالتة قفصية قابلة للطي شديدة التحمّل، مصممة لتخزين المواد ونقلها بأمان وكفاءة في البيئات الصناعية والمستودعات. تتميز ببنية متينة من أنابيب أسلاك فولاذية
    بسماكة 2.8 مم وبوابة وصول مفصلية وتصميم قابل للتكديس، لتوفر أداءً موثوقًا وسهولة في مناولة المواد. وتُطوى بنيتها الموفرة للمساحة على القاعدة عند الفراغ
    لتحسين استغلال مساحة التخزين. تتوفر بأبعاد 930 × 1130 × 830 مم (الارتفاع × العرض × العمق).
  tall-mobile-roll-cage: >-
    قفص متحرك متين، مصمم للتخزين الآمن ونقل البضائع ومناولتها بكفاءة في المستودعات ومرافق الخدمات اللوجستية. يتميز بهيكل شبكي من الأسلاك الفولاذية المجلفنة
    وقفل جانبي مريح وألواح قابلة للطي وسهلة الفك وقاعدة قابلة للتكديس، ليوفر مرونة وتخزينًا موفرًا للمساحة. مزوّد بعجلات دوّارة قطر 125 مم لحركة سلسة، ويدعم أغلفة متعددة لتخزين منظم ومصنّف.
  dismountable-standard-closed-roll-container: >-
    حاوية متحركة من الفولاذ المجلفن متينة، مصممة للتخزين الآمن ومناولة البضائع ونقلها بكفاءة في المستودعات ومرافق الخدمات اللوجستية. تتميز بقفل جانبي مريح
    وألواح قابلة للطي وسهلة الفك وقاعدة قابلة للتكديس، لتوفر مرونة وتخزينًا موفرًا للمساحة. مزوّدة بعجلات دوّارة قطر 125 مم لسهولة الحركة، وتدعم أغلفة متعددة لتخزين منظم ومصنّف.
  heavy-duty-platform-trolley: >-
    عربة منصة متينة، مصممة لنقل المواد والبضائع بأمان وكفاءة في المستودعات والمصانع ومرافق الخدمات اللوجستية. تتميز بتصميم عملي يسهّل التعامل والمناورة،
    لتوفر حلًا موثوقًا لنقل المواد وعمليات التخزين والتوزيع.
  rimal-floor-mat: >-
    نظام دعاسات مداخل معيارية عالي الجودة، مصمم لمناطق المداخل كثيفة الحركة في المباني التجارية والصناعية. يتميز ببروفيلات ألمنيوم متينة وحشوات سجاد
    من البولي بروبيلين 100% ووصلات شديدة التحمّل، ليوفر تجميعًا فعّالًا للأتربة وأداءً طويل الأمد وتشطيبًا احترافيًا. مناسب للتركيب الغائر أو السطحي،
    وسهل التنظيف والصيانة، مع توفر مقاسات مخصصة حسب متطلبات المشروع.
  moje-floor-mat: >-
    نظام دعاسات مداخل معيارية ببروفيلات ألمنيوم وحشوات سجاد من البولي بروبيلين، مصمم لمناطق المداخل والاستخدامات كثيفة الحركة.
  parque-floor-mat: >-
    دعاسة أرضيات معيارية شديدة التحمّل، مصممة للاستخدام الداخلي والخارجي، توفر المتانة والسلامة وتجميعًا فعّالًا للأتربة. تتميز ببروفيلات ألمنيوم
    مصنوعة من سبيكة EN AW-6063-T5 وفق المواصفة EN 755، مع حشوات مطاطية من PVC، لتوفر أداءً موثوقًا وسهولة في الصيانة. بوزن 11.9 كجم/م²
    وارتفاع دعاسة 13 مم وارتفاع إطار 15 مم، وهي مناسبة لمداخل المباني التجارية والصناعية.

